<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <title>Cognify - Sign In / Sign Up</title>
  </head>

  <body>
    <div class="auth-header">
      <a href="/" class="back-home-link" title="Back to Home"><i class="fas fa-arrow-left"></i> Home</a>
      <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle Light/Dark Theme">
        <i class="fas fa-moon" id="themeIcon"></i>
        <span id="themeLabel">Dark</span>
      </button>
    </div>

    <div class="container" id="container">
      <div class="form-container sign-up">
        <form id="signup-form">
          <h1>Create Account</h1>
          
          <input type="text" name="name" placeholder="Name" required />
          <input type="email" name="email" placeholder="Email" required />
          <input type="password" name="password" placeholder="Password" required />
          <button type="submit">Sign Up</button>
        </form>
      </div>

      <div class="form-container sign-in">
        <form id="signin-form">
          <h1>Sign In</h1>
          <span>use your email password</span>
          <input type="email" id="signin-email" name="email" placeholder="Email" required />
          <input type="password" id="signin-password" name="password" placeholder="Password" required />
          <a href="#" id="forgot-password-link">Forget Your Password?</a>
          <button type="submit">Sign In</button>
        </form>

        <form id="reset-form" class="hidden-form">
          <h1>Reset Password</h1>
          <span>enter your email and new password</span>
          <input type="email" id="reset-email" name="email" placeholder="Registered Email" required />
          <input type="password" id="reset-password" name="newPassword" placeholder="New Password" required minlength="4" />
          <a href="#" id="back-to-signin-link">Back to Sign In</a>
          <button type="submit">Reset Password</button>
        </form>
      </div>

      <div class="toggle-container">
        <div class="toggle">
          <div class="toggle-panel toggle-left">
            <h1>Welcome Back!</h1>
            <p>Enter your personal details to use all of site features</p>
            <button class="hidden" id="login">Sign In</button>
          </div>
          <div class="toggle-panel toggle-right">
            <h1>Hello, Friend!</h1>
            <p>
              Register with your personal details to use all of site features
            </p>
            <button class="hidden" id="register">Sign Up</button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
